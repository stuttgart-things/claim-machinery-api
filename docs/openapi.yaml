openapi: 3.0.3
info:
  title: Claim Machinery API
  version: "0.1.0"
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json: {}
  /api/v1/claim-templates:
    get:
      summary: List claim templates
      responses:
        '200':
          description: OK
          content:
            application/json: {}
  /api/v1/claim-templates/{name}:
    get:
      summary: Get template by name
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json: {}
  /api/v1/claim-templates/{name}/order:
    post:
      summary: Render template with parameters
      description: |
        Renders the template and sends the homerun notification. When the
        service runs with AUTH_OIDC_ISSUER, a JWT of that issuer is required
        (aud in AUTH_OIDC_AUDIENCE, optionally one of AUTH_ORDER_ROLES); the
        token's user becomes the author when none is given. Without
        AUTH_OIDC_ISSUER the endpoint is open.

        With auth on, the template's identity rules apply (#122): its
        spec.orderRoles limit who may order it (admins in AUTH_ADMIN_ROLES
        always may); a parameter with identity: user is set from the login
        (user:default/<preferred_username without domain>) and a different
        value is refused with 400; a parameter with identity: owner defaults
        to the login and may only name the login or one of its groups (the
        roles mapped to Backstage groups), any value for an admin, else 403.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json: {}
        '400':
          description: Bad Request; with auth also a value sent for an identity-bound (identity user) parameter that is not the login
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json: {}
        '401':
          description: Bearer token missing or invalid (only with AUTH_OIDC_ISSUER)
          content:
            application/json: {}
        '403':
          description: Token lacks one of AUTH_ORDER_ROLES or of the template's orderRoles, or names an owner that is neither the login nor one of its groups
          content:
            application/json: {}
        '503':
          description: Identity provider unreachable
          content:
            application/json: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ZITADEL-issued JWT (access or ID token) of the lab issuer
