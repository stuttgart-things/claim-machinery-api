openapi: 3.0.3
info:
  title: Claim Machinery API
  version: "0.1.0"
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json: {}
  /api/v1/claim-templates:
    get:
      summary: List claim templates
      responses:
        '200':
          description: OK
          content:
            application/json: {}
  /api/v1/claim-templates/{name}:
    get:
      summary: Get template by name
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The template; parameters carry showWhen / enumWhen when the template declares them (#135)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimTemplate'
        '404':
          description: Not Found
          content:
            application/json: {}
  /api/v1/claim-templates/{name}/order:
    post:
      summary: Render template with parameters
      description: |
        Renders the template and sends the homerun notification. When the
        service runs with AUTH_OIDC_ISSUER, a JWT of that issuer is required
        (aud in AUTH_OIDC_AUDIENCE, optionally one of AUTH_ORDER_ROLES); the
        token's user becomes the author when none is given. Without
        AUTH_OIDC_ISSUER the endpoint is open.

        With auth on, the template's identity rules apply (#122): its
        spec.orderRoles limit who may order it (admins in AUTH_ADMIN_ROLES
        always may); a parameter with identity: user is set from the login
        (user:default/<preferred_username without domain>) and a different
        value is refused with 400; a parameter with identity: owner defaults
        to the login and may only name the login or one of its groups (the
        roles mapped to Backstage groups), any value for an admin, else 403.

        The parameters are checked against the template before KCL runs
        (#135): values of parameters whose showWhen does not match are
        ignored; required, enum (narrowed by enumWhen), pattern,
        minLength/maxLength and boolean values are checked, and a violation
        answers 400 with {"error":"invalid parameters","fields":{...}}. A
        failing assert of the KCL module answers 400 with only its message;
        other render failures are 500.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json: {}
        '400':
          description: |
            Invalid body; invalid parameters (error "invalid parameters" with
            fields); a failed assert of the KCL module (error is its message);
            with auth also a value sent for an identity-bound (identity user)
            parameter that is not the login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParameters:
                  value: {"error": "invalid parameters", "fields": {"size": "use_case dev allows large or xlarge, got small"}}
                kclAssert:
                  value: {"error": "use_case dev needs size large or xlarge, got small"}
        '404':
          description: Not Found
          content:
            application/json: {}
        '401':
          description: Bearer token missing or invalid (only with AUTH_OIDC_ISSUER)
          content:
            application/json: {}
        '500':
          description: Rendering failed for another reason than the parameters (OCI pull, KCL syntax/runtime error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token lacks one of AUTH_ORDER_ROLES or of the template's orderRoles, or names an owner that is neither the login nor one of its groups
          content:
            application/json: {}
        '503':
          description: Identity provider unreachable
          content:
            application/json: {}
  /api/v1/claim-templates/{name}/order-pr:
    post:
      summary: Order through a GitOps pull request (off by default)
      description: |
        Exists only when the service runs with order auth (AUTH_OIDC_ISSUER)
        AND the GitHub App dispatch credentials (GITHUB_DISPATCH_APP_ID,
        GITHUB_DISPATCH_INSTALLATION_ID, GITHUB_DISPATCH_PRIVATE_KEY_FILE);
        otherwise it answers 404. Issue #131.

        Checks the bearer token and the template's identity rules exactly as
        POST .../order does, renders once without notification to validate
        the parameters, then starts workflow_dispatch of
        GITHUB_DISPATCH_WORKFLOW (default dispatch-order-claim.yaml) in
        GITHUB_DISPATCH_REPO (default stuttgart-things/stuttgart-things) on
        GITHUB_DISPATCH_REF (default main) with the inputs template, params
        (the request's parameters as JSON), requested_by (the token's user,
        never taken from the body), reason and order_id. The workflow runs
        `claims render --layout source-path --create-pr`, which opens the
        pull request; merging it applies the order.

        Templates that create secrets, or have a parameter with
        identity: user, cannot be ordered this way (422).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPRRequest'
      responses:
        '202':
          description: Workflow dispatched; the pull request is opened by the run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPRResponse'
        '400':
          description: Invalid body, invalid parameters (with fields) or a failed KCL module assert, as for POST .../order; or a value for an identity-bound parameter that is not the login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Bearer token missing or invalid
          content:
            application/json: {}
        '403':
          description: Token lacks one of AUTH_ORDER_ROLES or of the template's orderRoles, or names a foreign owner
          content:
            application/json: {}
        '404':
          description: Template not found, or order as PR is not enabled
          content:
            application/json: {}
        '422':
          description: Template excluded (secrets, identity user parameter) or the render fails for another reason than the parameters
          content:
            application/json: {}
        '502':
          description: GitHub refused the dispatch
          content:
            application/json: {}
        '503':
          description: Identity provider unreachable
          content:
            application/json: {}
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: '"invalid parameters" when fields is set; else the message (for a KCL assert only the assert message)'
        fields:
          type: object
          description: Parameter name -> what is wrong with its value (#135)
          additionalProperties:
            type: string
    ClaimTemplate:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            title:
              type: string
            description:
              type: string
            tags:
              type: array
              items:
                type: string
            profile:
              type: string
        spec:
          type: object
          properties:
            type:
              type: string
            source:
              type: string
            tag:
              type: string
            orderRoles:
              type: array
              items:
                type: string
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/Parameter'
            secrets:
              type: array
              items:
                type: object
    Parameter:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [string, boolean, integer, number, array]
        default: {}
        required:
          type: boolean
        enum:
          type: array
          items:
            type: string
        hidden:
          type: boolean
        allowRandom:
          type: boolean
        multiselect:
          type: boolean
        valueFrom:
          type: object
          properties:
            function:
              type: string
            args:
              type: object
              additionalProperties:
                type: string
            condition:
              type: string
        identity:
          type: string
          enum: [user, owner]
        pattern:
          type: string
        minLength:
          type: integer
        maxLength:
          type: integer
        showWhen:
          type: object
          description: |
            The parameter applies only when every named parameter's value
            (sent, else its default; compared as strings) is one of the
            listed values. Clients hide it otherwise; the API ignores a value
            sent for it. An inactive parameter has no value for other
            conditions. Absent: always applies.
          additionalProperties:
            type: array
            items:
              type: string
          example: {"use_case": ["dev"]}
        enumWhen:
          type: object
          description: |
            Controlling parameter -> its value -> the values this parameter
            allows meanwhile. A value not listed leaves enum as it is;
            several controlling parameters intersect.
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
          example: {"use_case": {"dev": ["large", "xlarge"], "rke2": ["medium", "large", "xlarge"]}}
    OrderPRRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
        reason:
          type: string
          maxLength: 500
          description: Free text for the pull request body
    OrderPRResponse:
      type: object
      properties:
        apiVersion:
          type: string
          example: api.claim-machinery.io/v1alpha1
        kind:
          type: string
          example: OrderPRResponse
        metadata:
          type: object
        orderId:
          type: string
          example: cma-0123456789ab
          description: Names the run (run-name) and is written into the pull request body
        template:
          type: string
        requestedBy:
          type: string
        run:
          type: object
          description: Missing when the run did not show up in time; follow workflowUrl
          properties:
            id:
              type: integer
              format: int64
            url:
              type: string
        workflowUrl:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ZITADEL-issued JWT (access or ID token) of the lab issuer
