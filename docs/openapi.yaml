openapi: 3.0.3
info:
  title: Claim Machinery API
  version: "0.1.0"
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json: {}
  /api/v1/claim-templates:
    get:
      summary: List claim templates
      responses:
        '200':
          description: OK
          content:
            application/json: {}
  /api/v1/claim-templates/{name}:
    get:
      summary: Get template by name
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json: {}
  /api/v1/claim-templates/{name}/order:
    post:
      summary: Render template with parameters
      description: |
        Renders the template and sends the homerun notification. When the
        service runs with AUTH_OIDC_ISSUER, a JWT of that issuer is required
        (aud in AUTH_OIDC_AUDIENCE, optionally one of AUTH_ORDER_ROLES); the
        token's user becomes the author when none is given. Without
        AUTH_OIDC_ISSUER the endpoint is open.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json: {}
        '400':
          description: Bad Request
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json: {}
        '401':
          description: Bearer token missing or invalid (only with AUTH_OIDC_ISSUER)
          content:
            application/json: {}
        '403':
          description: Token lacks one of AUTH_ORDER_ROLES
          content:
            application/json: {}
        '503':
          description: Identity provider unreachable
          content:
            application/json: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ZITADEL-issued JWT (access or ID token) of the lab issuer
