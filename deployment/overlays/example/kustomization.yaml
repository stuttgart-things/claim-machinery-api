---
# Example kustomize overlay for claim-machinery-api.
#
# Setup: pull the kustomize base from OCI into deployment/kustomize-base:
#   oras pull ghcr.io/stuttgart-things/claim-machinery-api-kustomize:<version> \
#     -o deployment/kustomize-base
#
# Preview:
#   kubectl kustomize deployment/overlays/example/
#
# Apply:
#   kubectl apply -k deployment/overlays/example/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../kustomize-base

patches:
  - path: patch-image.yaml
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: claim-machinery-api
