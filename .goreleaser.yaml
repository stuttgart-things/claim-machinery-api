# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: claim-machinery-api
    main: .
    binary: claim-machinery-api
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -extldflags=-static
      - -X github.com/stuttgart-things/claim-machinery-api/cmd.version={{.Version}}
      - -X github.com/stuttgart-things/claim-machinery-api/cmd.commit={{.Commit}}
      - -X github.com/stuttgart-things/claim-machinery-api/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: stuttgart-things
    name: claim-machinery-api
  draft: false
  prerelease: auto
  footer: |
    ## Installation

    ### Binary
    Download the appropriate binary for your platform from the assets below.

    ### Container Image
    ```bash
    docker pull ghcr.io/stuttgart-things/claim-machinery-api:{{ .Tag }}
    ```

    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
