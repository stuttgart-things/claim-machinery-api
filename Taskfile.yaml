---
version: 3

includes:
  git:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/git/git.yaml
  lint:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/git/linting.yaml
  go:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/go/lint.yaml
  dagger:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/dagger/modules.yaml
  image:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/docker/copy.yaml
  goBuild:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/go/build.yaml

  k8sMicroservice:
    taskfile: /home/sthings/projects/tasks/go/k8s-microservice.yaml

vars:
  DATE:
    sh: date +"%y.%m%d.%H%M"
  PROJECT:
    sh: |
      basename $(pwd)
  GO_MODULE: github.com/stuttgart-things/claim-machinery-api
  DAGGER_MOUDLE_DIR: ./.dagger
  SOURCE_CODE_DIR: "."
  BIN_EXPORT_PATH: /tmp/go/build
  TEMPLATES_DIR: internal/claimtemplate/testdata
  TEMPLATE_PROFILE_PATH: tests/profile.yaml
  DAGGER_KCL_MODULE: github.com/stuttgart-things/dagger/kcl@v0.74.0
  DEPLOYMENT_SOURCE_DIR: deployment
  KCL_PROFILE_FILE: tests/kcl-deploy-profile.yaml
  RENDERED_OUTPUT_PATH: /tmp/rendered-{{ .PROJECT }}.yaml
  LINT_REPORT_PATH: /tmp/lint-report-{{ .PROJECT }}.txt
  TEST_REPORT_PATH: /tmp/test-report-{{ .PROJECT }}.txt

tasks:
  commit:
    desc: Commit and push with Dagger pre-commit validation
    # deps: [pre-commit]
    cmds:
      - task: k8sMicroservice:commit
        vars:
          LINT_SOURCE_DIR: "./"
          YAML_CONFIG_PATH: .yamllint
          MARKDOWN_CONFIG_PATH: .mdlrc
          MERGED_OUTPUT_FILE: 'md-yaml-lint-findings.txt'


  pr-git:
    desc: Create pr
    description: Create a pull request with pior linting, building, testing, and scanning
    deps: [pr]
    cmds:
      - task: git:pr

  release-bin:
    desc: Release binary via goreleaser using Dagger
    cmds:
      - task: git:release
      - task: goBuild:release
        vars:
          SRC: .
          CHECK_ONLY:
            sh: |
              gum choose --header "Perform a dry run only?" "true" "false" || echo "false"
          OUTPUT_PATH: /tmp/claims/goreleaser.log
          RELEASER_VERSION: v2.13.3

  pr:
    desc: Create pull request
    cmds:
      - task: lint
      - task: build-test-api
      - task: build-scan-image-kcl
      - task: build-output-binary
      - |
        echo ""
        echo "==================== SUMMARY ===================="
        echo "✔ Lint: Code was checked"
        echo "  → Lint report: {{ .LINT_REPORT_PATH }}"
        echo "✔ Build & Test: API built and tested"
        echo "  → Test output: {{ .TEST_REPORT_PATH }}"
        echo "✔ Build & Scan: Container image built, pushed and scanned"
        echo "================================================="

  build:
    desc: Build binary using Dagger with ldflags
    vars:
      VERSION: '{{.VERSION | default "0.0.1"}}'
      OS: '{{.OS | default "linux"}}'
      ARCH: '{{.ARCH | default "amd64"}}'
      OUTPUT_PATH: '{{.OUTPUT_PATH | default "/tmp/go/build/"}}'
      BIN_NAME: '{{.BIN_NAME | default .PROJECT}}'
    cmds:
      - |
        dagger call -m github.com/stuttgart-things/dagger/go build-binary \
          --src "." \
          --go-version "1.25.6" \
          --os {{ .OS }} \
          --arch {{ .ARCH }} \
           --package-name github.com/stuttgart-things/claim-machinery-api \
          --ldflags "cmd.version={{ .VERSION }}; cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ); cmd.commit=$(git rev-parse --short HEAD 2>/dev/null || echo 'none')" \
          --go-main-file main.go \
          --bin-name {{ .BIN_NAME }} \
          --variant "" \
          export --path={{ .OUTPUT_PATH }} \
          --progress plain -vv

  stage-image:
    desc: Copy image from ttl.sh to ghcr.io with git tag version
    vars:
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0"
      SOURCE_IMAGE: '{{ .SOURCE_IMAGE | default "ttl.sh/claim-machinery-api:latest" }}'
    cmds:
      - |
        echo "📦 Staging image with version: {{ .VERSION }}"
        echo "📥 Source: {{ .SOURCE_IMAGE }}"
        echo "📤 Target: ghcr.io/stuttgart-things/{{ .PROJECT }}:{{ .VERSION }}"
      - task: image:copy-image
        vars:
          SOURCE: "{{ .SOURCE_IMAGE }}"
          TARGET: ghcr.io/stuttgart-things/{{ .PROJECT }}:{{ .VERSION }}
          TARGET_USERNAME: $GITHUB_USER
          TARGET_PASSWORD: env:GITHUB_TOKEN # pragma: allowlist secret

  lint:
    desc: Run Go lint via Dagger module
    cmds:
      - |
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} lint \
          --src "{{ .SOURCE_CODE_DIR }}" \
          export --path={{ .LINT_REPORT_PATH }} \
          --progress plain

  build-test-api:
    desc: Build and test api
    cmds:
      - |
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} build-and-test \
        --src "{{ .SOURCE_CODE_DIR }}" \
        --progress plain -vv | tee {{ .TEST_REPORT_PATH }}

  # build-push-image-kcl:
  #   desc: Build and push container image with KCL build module
  #   vars:
  #     DEV_IMAGE_DESTINATION: "ttl.sh/sthings/claim-machinery-api"
  #   cmds:
  #     - |
  #       dagger call -m {{ .DAGGER_MOUDLE_DIR }} build-image-with-kcl \
  #       --source "{{ .SOURCE_CODE_DIR }}" \
  #       --repo "{{ .DEV_IMAGE_DESTINATION }}:{{ .DATE }}" \
  #       --push=true \
  #       --progress plain -vv

  build-scan-image-kcl:
    desc: Build, push and scan container image with KCL build module
    cmds:
      - |
        RANDOM_TAG=$(openssl rand -hex 6)
        IMAGE_REF="ttl.sh/{{ .PROJECT }}-${RANDOM_TAG}:latest"

        echo "🔨 Building with KCL and pushing to: ${IMAGE_REF}"
        echo ""

        # Build and push with KCL build module
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} build-image-with-kcl \
          --source "{{ .SOURCE_CODE_DIR }}" \
          --repo "$IMAGE_REF" \
          --push="true" \
          --progress plain

        echo ""
        echo "✅ Image pushed: $IMAGE_REF"
        echo ""
        echo "🔍 Scanning with Trivy..."
        echo ""

        # Export scan report
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} scan-image \
          --image-ref "$IMAGE_REF" \
          --severity "HIGH,CRITICAL" \
          --progress plain \
          export --path=/tmp/trivy-scan-{{ .PROJECT }}.json

        echo ""
        echo "✅ Build and scan complete!"
        echo "📦 Image: $IMAGE_REF"
        echo "📦 Pull: docker pull $IMAGE_REF"
        echo "📄 Scan Report: /tmp/trivy-scan-{{ .PROJECT }}.json"
        echo "⏰ Expires: 1 hour (default ttl.sh)"

        # Show summary
        if command -v jq &> /dev/null; then
          echo ""
          echo "📊 Vulnerability Summary:"
          jq -r '.Results[]? | select(.Vulnerabilities) | "\(.Target): \(.Vulnerabilities | length) vulnerabilities"' \
            /tmp/trivy-scan-{{ .PROJECT }}.json 2>/dev/null || echo "✅ No HIGH/CRITICAL vulnerabilities found!"
        fi

  build-scan-stage-image:
    desc: Build, scan, stage image to ghcr.io and git commit
    vars:
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0"
    cmds:
      - |
        set -e
        RANDOM_TAG=$(openssl rand -hex 6)
        IMAGE_REF="ttl.sh/{{ .PROJECT }}-${RANDOM_TAG}:latest"

        echo "🔨 Building with KCL and pushing to: ${IMAGE_REF}"
        echo ""

        # Build and push with KCL build module
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} build-image-with-kcl \
          --source "{{ .SOURCE_CODE_DIR }}" \
          --repo "$IMAGE_REF" \
          --push="true" \
          --progress plain

        echo ""
        echo "✅ Image pushed: $IMAGE_REF"
        echo ""
        echo "🔍 Scanning with Trivy..."
        echo ""

        # Export scan report
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} scan-image \
          --image-ref "$IMAGE_REF" \
          --severity "HIGH,CRITICAL" \
          --progress plain \
          export --path=/tmp/trivy-scan-{{ .PROJECT }}.json

        echo ""
        echo "✅ Build and scan complete!"
        echo "📦 Image: $IMAGE_REF"

        # Show summary
        if command -v jq &> /dev/null; then
          echo ""
          echo "📊 Vulnerability Summary:"
          jq -r '.Results[]? | select(.Vulnerabilities) | "\(.Target): \(.Vulnerabilities | length) vulnerabilities"' \
            /tmp/trivy-scan-{{ .PROJECT }}.json 2>/dev/null || echo "✅ No HIGH/CRITICAL vulnerabilities found!"
        fi

        # Save image ref for stage task
        echo "$IMAGE_REF" > /tmp/{{ .PROJECT }}-build-image-ref.txt
      - task: stage-image
        vars:
          SOURCE_IMAGE:
            sh: cat /tmp/{{ .PROJECT }}-build-image-ref.txt

  build-output-binary:
    desc: Build project binary
    cmds:
      - |
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} build \
        --src "{{ .SOURCE_CODE_DIR }}" \
        --bin-name="{{ .PROJECT }}" \
         --ldflags "-X {{ .GO_MODULE }}/cmd.Version={{ .DATE }} -X {{ .GO_MODULE }}/cmd.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X {{ .GO_MODULE }}/cmd.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo 'none')" \
        --progress plain -vv \
        export --path={{ .BIN_EXPORT_PATH }}

        ls -lta {{ .BIN_EXPORT_PATH }}
        du -sh {{ .BIN_EXPORT_PATH }}/{{ .PROJECT }}

        # SUMMARY
        BIN_FILE="{{ .BIN_EXPORT_PATH }}/{{ .PROJECT }}"
        SIZE=$(du -sh "$BIN_FILE" | awk '{print $1}')
        SHASUM=$(sha256sum "$BIN_FILE" | awk '{print $1}')

        BLUE='\033[1;34m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        NC='\033[0m'

        echo -e "${BLUE}==============================================${NC}"
        {{ .BIN_EXPORT_PATH }}/{{ .PROJECT }} version

  build-scan-image-ko:
    desc: Build, push and scan container image
    cmds:
      - |
        RANDOM_TAG=$(openssl rand -hex 6)
        REPO_NAME="ttl.sh/{{ .PROJECT }}-${RANDOM_TAG}"

        echo "🔨 Building and pushing to: ${REPO_NAME}"
        echo ""

        # Build and push directly to ttl.sh (no auth needed)
        IMAGE_REF=$(dagger call -m {{ .DAGGER_MOUDLE_DIR }} build-image \
          --src "{{ .SOURCE_CODE_DIR }}" \
          --repo "$REPO_NAME" \
          --push="true" \
          --scan="true" \
          --scan-severity="HIGH,CRITICAL" \
          --progress plain)

        echo ""
        echo "✅ Image pushed: $IMAGE_REF"
        echo ""
        echo "🔍 Generating scan report..."
        echo ""

        # Export scan report
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} scan-image \
          --image-ref "$IMAGE_REF" \
          --severity "HIGH,CRITICAL" \
          --progress plain \
          export --path=/tmp/trivy-scan-{{ .PROJECT }}.json

        echo ""
        echo "✅ Build and scan complete!"
        echo "📦 Image: $IMAGE_REF"
        echo "📦 Pull: docker pull $IMAGE_REF"
        echo "📄 Scan Report: /tmp/trivy-scan-{{ .PROJECT }}.json"
        echo "⏰ Expires: 1 hour (default ttl.sh)"

        # Show summary
        if command -v jq &> /dev/null; then
          echo ""
          echo "📊 Vulnerability Summary:"
          jq -r '.Results[]? | select(.Vulnerabilities) | "\(.Target): \(.Vulnerabilities | length) vulnerabilities"' \
            /tmp/trivy-scan-{{ .PROJECT }}.json 2>/dev/null || echo "✅ No HIGH/CRITICAL vulnerabilities found!"
        fi

  scan-image-interactive:
    desc: Scan container image for vulnerabilities with Trivy (interactive prompts)
    vars:
      IMAGE_REF:
        sh: 'gum input --placeholder "Enter image reference (e.g., ttl.sh/my-app:latest)" --header "IMAGE TO SCAN"'
      SEVERITY:
        sh: 'gum input --placeholder "Severity levels" --value "HIGH,CRITICAL" --header "SEVERITY"'
    cmds:
      - |
        echo ""
        echo "🔍 Scanning image: {{ .IMAGE_REF }}"
        echo "⚠️  Severity: {{ .SEVERITY }}"
        echo ""

        dagger call -m {{ .DAGGER_MOUDLE_DIR }} scan-image \
          --image-ref "{{ .IMAGE_REF }}" \
          --severity "{{ .SEVERITY }}" \
          --progress plain \
          export --path=/tmp/trivy-scan-{{ .PROJECT }}.json

        echo ""
        echo "✅ Scan complete!"
        echo "📄 Report: /tmp/trivy-scan-{{ .PROJECT }}.json"

        # Show summary if jq is available
        if command -v jq &> /dev/null; then
          echo ""
          echo "📊 Vulnerability Summary:"
          jq -r '.Results[]? | select(.Vulnerabilities) | "\(.Target): \(.Vulnerabilities | length) vulnerabilities"' \
            /tmp/trivy-scan-{{ .PROJECT }}.json 2>/dev/null || echo "✅ No vulnerabilities found!"
        fi

  scan-image:
    desc: Scan container image for vulnerabilities with Trivy (non-interactive, vars only)
    vars:
      IMAGE_REF: '{{ .IMAGE_REF | default "ttl.sh/example:latest" }}'
      SEVERITY: '{{ .SEVERITY | default "HIGH,CRITICAL" }}'
    cmds:
      - |
        echo ""
        echo "🔍 Scanning image: {{ .IMAGE_REF }}"
        echo "⚠️  Severity: {{ .SEVERITY }}"
        echo ""

        dagger call -m {{ .DAGGER_MOUDLE_DIR }} scan-image \
          --image-ref "{{ .IMAGE_REF }}" \
          --severity "{{ .SEVERITY }}" \
          --progress plain \
          export --path=/tmp/trivy-scan-{{ .PROJECT }}.json

        echo ""
        echo "✅ Scan complete!"
        echo "📄 Report: /tmp/trivy-scan-{{ .PROJECT }}.json"

        # Show summary if jq is available
        if command -v jq &> /dev/null; then
          echo ""
          echo "📊 Vulnerability Summary:"
          jq -r '.Results[]? | select(.Vulnerabilities) | "\(.Target): \(.Vulnerabilities | length) vulnerabilities"' \
            /tmp/trivy-scan-{{ .PROJECT }}.json 2>/dev/null || echo "✅ No vulnerabilities found!"
        fi

  run-api:
    desc: Run API as Dagger service with profile
    cmds:
      - |
        dagger call -m {{ .DAGGER_MOUDLE_DIR }} run-api \
          --source "{{ .SOURCE_CODE_DIR }}" \
          --profile-file {{ .TEMPLATE_PROFILE_PATH }} \
          up --progress plain

  run-local-go:
    desc: Run API locally with go run (flags supported)
    cmds:
      - |
        set -e
        FLAGS="--templates-dir {{ .TEMPLATES_DIR }}"
        if [ -n "{{ .TEMPLATE_PROFILE_PATH }}" ]; then
          FLAGS="$FLAGS --template-profile-path {{ .TEMPLATE_PROFILE_PATH }}"
        fi
        echo "Running: go run main.go $FLAGS"
        go run main.go $FLAGS

  run-local-bin:
    desc: Run exported binary locally (flags supported)
    deps: [build-output-binary]
    cmds:
      - |
        set -e
        BIN_FILE="{{ .BIN_EXPORT_PATH }}/{{ .PROJECT }}"
        if [ ! -x "$BIN_FILE" ]; then
          echo "Binary nicht gefunden unter $BIN_FILE. Bitte zuerst 'task build-output-binary' ausführen." >&2
          exit 1
        fi
        FLAGS="--templates-dir {{ .TEMPLATES_DIR }}"
        if [ -n "{{ .TEMPLATE_PROFILE_PATH }}" ]; then
          FLAGS="$FLAGS --template-profile-path {{ .TEMPLATE_PROFILE_PATH }}"
        fi
        echo "Running: PORT=8080 $BIN_FILE $FLAGS"
        PORT=8080 "$BIN_FILE" $FLAGS

  render-manifests:
    desc: Render Kubernetes manifests using KCL via Dagger
    vars:
      SOURCE:
        sh: 'gum input --placeholder "Source directory" --value "{{ .DEPLOYMENT_SOURCE_DIR }}" --header "KCL SOURCE DIRECTORY"'
      PROFILE:
        sh: 'gum input --placeholder "Profile file path" --value "{{ .KCL_PROFILE_FILE }}" --header "PARAMETERS FILE"'
      DESTINATION:
        sh: 'gum input --placeholder "Output path" --value "{{ .RENDERED_OUTPUT_PATH }}" --header "OUTPUT PATH"'
    cmds:
      - |
        echo ""
        echo "🔨 Rendering manifests with KCL..."
        echo "📂 Source: {{ .SOURCE }}"
        echo "📄 Profile: {{ .PROFILE }}"
        echo "📦 Output: {{ .DESTINATION }}"
        echo ""

        dagger call -m {{ .DAGGER_KCL_MODULE }} run \
          --source "{{ .SOURCE }}" \
          --parameters-file="{{ .PROFILE }}" \
          export --path="{{ .DESTINATION }}"

        echo ""
        echo "✅ Manifests rendered successfully!"
        echo "📄 Output file: {{ .DESTINATION }}"
        echo ""

        # Show preview if file exists
        if [ -f "{{ .DESTINATION }}" ]; then
          echo "📋 Preview:"
          head -n 20 "{{ .DESTINATION }}"
          echo ""
          echo "... (use 'cat {{ .DESTINATION }}' to view full file)"
        fi

  render-manifests-quick:
    desc: Render Kubernetes manifests (non-interactive, uses defaults)
    vars:
      SOURCE: '{{ .SOURCE | default .DEPLOYMENT_SOURCE_DIR }}'
      PROFILE: '{{ .PROFILE | default .KCL_PROFILE_FILE }}'
      DESTINATION: '{{ .DESTINATION | default .RENDERED_OUTPUT_PATH }}'
    cmds:
      - |
        echo ""
        echo "🔨 Rendering manifests with KCL..."
        echo "📂 Source: {{ .SOURCE }}"
        echo "📄 Profile: {{ .PROFILE }}"
        echo "📦 Output: {{ .DESTINATION }}"
        echo ""

        dagger call -m {{ .DAGGER_KCL_MODULE }} run \
          --source "{{ .SOURCE }}" \
          --parameters-file="{{ .PROFILE }}" \
          export --path="{{ .DESTINATION }}"

        echo ""
        echo "✅ Manifests rendered successfully!"
        echo "📄 Output file: {{ .DESTINATION }}"

  copy-image:
    desc: Copy image from ttl.sh to ghcr.io
    cmds:
      - task: image:copy-image
        vars:
          SOURCE: ttl.sh/claim-machinery-api-57cf04b1fb68:latest
          TARGET: ghcr.io/stuttgart-things/claim-machinery-api:latest
          TARGET_USERNAME: patrick-hermann-sva
          TARGET_PASSWORD: env:GITHUB_TOKEN # pragma: allowlist secret

  do:
    desc: Select a task to run
    cmds:
      - |
        # Extract task names (keep internal colons, remove only trailing colon)
        task_name=$(task -l | awk '/^\*/ {print $2}' | sed 's/:$//' | gum choose)

        # Run the selected task
        [ -n "$task_name" ] && task "$task_name"
